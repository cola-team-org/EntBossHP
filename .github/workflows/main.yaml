name: Build and Release

on:
  push:
    branches:
      - main
      - v2.0.0

env:
  PLUGIN_VERSION: "2.0.0" # EDIT THIS LINE TO CREATE A NEW RELEASE

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Needed for tag checking

      - name: Check if tag exists
        id: check_tag
        run: |
          # Check if a tag for the version in this workflow file already exists
          if git rev-parse "refs/tags/EntBossHP-v${{ env.PLUGIN_VERSION }}" >/dev/null 2>&1; then
            echo "TAG_EXISTS=true" >> $GITHUB_OUTPUT
            echo "A release for version ${{ env.PLUGIN_VERSION }} already exists. Skipping release steps."
          else
            echo "TAG_EXISTS=false" >> $GITHUB_OUTPUT
            echo "Creating a new release for version ${{ env.PLUGIN_VERSION }}."
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create Release Directory Structure
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: mkdir -p release/addons/counterstrikesharp/plugins/EntBossHP

      - name: Copy Files
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: cp -r ./publish/* release/addons/counterstrikesharp/plugins/EntBossHP/

      - name: Zip Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        run: |
          cd release
          zip -r ../EntBossHP.zip .

      - name: Create Release
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EntBossHP-v${{ env.PLUGIN_VERSION }}
          release_name: EntBossHP v${{ env.PLUGIN_VERSION }}
          body: |
            Automated release for version ${{ env.PLUGIN_VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: steps.check_tag.outputs.TAG_EXISTS == 'false'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./EntBossHP.zip
          asset_name: EntBossHP.zip
          asset_content_type: application/zip
