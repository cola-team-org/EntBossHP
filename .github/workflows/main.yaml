name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2 # Needed to check for file changes

      - name: Check for version change
        id: check_version
        run: |
          # Check if build.yaml was changed in the last commit
          if git diff --name-only HEAD~1 HEAD | grep -q "build.yaml"; then
            echo "VERSION_CHANGED=true" >> $GITHUB_OUTPUT
          else
            echo "VERSION_CHANGED=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Create Release Directory Structure
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        run: mkdir -p release/addons/counterstrikesharp/plugins/EntBossHP

      - name: Copy Files
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        run: cp -r ./publish/* release/addons/counterstrikesharp/plugins/EntBossHP/

      - name: Zip Release
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        run: |
          cd release
          zip -r ../EntBossHP.zip .

      - name: Get Version from build.yaml
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        id: get_version
        run: |
          VERSION=$(grep 'version:' build.yaml | sed 's/version: *//')
          VERSION=${VERSION#v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EntBossHP-v${{ steps.get_version.outputs.VERSION }}
          release_name: EntBossHP v${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated release for version ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        if: steps.check_version.outputs.VERSION_CHANGED == 'true'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./EntBossHP.zip
          asset_name: EntBossHP.zip
          asset_content_type: application/zip
