name: Release on Build YAML Change

on:
  push:
    branches:
      - main
    paths:
      - 'build.yaml'

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Create Release Directory Structure
        run: mkdir -p release/addons/counterstrikesharp/plugins/EntBossHP

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./release/addons/counterstrikesharp/plugins/EntBossHP

      - name: Zip Release
        run: |
          cd release
          zip -r ../EntBossHP.zip .

      - name: Get Version from build.yaml
        id: get_version
        run: |
          echo "VERSION=$(grep 'version:' build.yaml | sed 's/version: *//')" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EntBossHP-v${{ steps.get_version.outputs.VERSION }}
          release_name: EntBossHP v${{ steps.get_version.outputs.VERSION }}
          body: |
            Automated release for version ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./EntBossHP.zip
          asset_name: EntBossHP.zip
          asset_content_type: application/zip
